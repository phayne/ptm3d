# (433) Eros over one orbit of 643 days that ends on the day of asteroid_eros.yaml. It writes the
# statistics of each face (minimum, mean and maximum over the window) and the temperature at every
# step at the sites in asteroid_sites.csv, and no per-step maps. Make the data as described in
# asteroid_eros.yaml, then run from the repository root:
#   ./build/bin/ptm_thermal_sim --config examples/asteroid_eros_orbit.yaml
# Tutorial: docs/tutorials/06_asteroids.md

simulation:
  start_time: '1997-03-20T11:00:00'
  duration_days: 643.0           # one orbit
  timesteps: 47000               # 16 outputs per rotation
  body: Eros
mesh:
  resolution: 3                  # not used: the shape comes from generic_body.shape
thermal:
  run_thermal_mesh: true
  threads: 0
  equilibration_orbits: 500.0    # rotations before the window (about 110 days)
  equilibration_steps_per_day: 230.4
  use_gpu: false
thermophysical:
  use_default_albedo: false
radiation:
  enabled: false
illumination:
  include_primary_reflection: false
  use_albedo_map: false
output:
  directory: output/asteroid_eros_orbit
  skip_time_series: true         # write the statistics only
  locations_file: examples/asteroid_sites.csv
  series_output: orbit_sites.csv   # temperature at every step at these sites
generic_body:
  name: 433 Eros (A898 PA)
  ephemeris_source: spice
  spice_metakernel: data/asteroids/eros/metakernel.tm
  naif_id: '20000433'
  shape:
    type: custom_mesh
    mesh_file: data/asteroids/eros/shape.obj
    radius_km: 8.410
  spin:
    period_hours: 5.27025528
    pole_ra_deg: 11.290620
    pole_dec_deg: 16.811616
    prime_meridian_deg: 305.978632
    epoch: 'JD 2451545.000000'
  surface:
    albedo: 0.151
    emissivity: 0.95
    ks: 0.01875                  # with rho and cp this gives a thermal inertia of 150
    kd: 0.01875
    rhos: 1500.0
    rhod: 1500.0
    H: 0.05
    cp0: 800.0
    Qb: 0.0
    chi: 0.0
