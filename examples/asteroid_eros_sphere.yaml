# (433) Eros as a sphere, on a Keplerian orbit built from the osculating elements that JPL Horizons
# gives at the start of the window. The diameter, pole and rotation period are those Horizons
# lists. Make the data with fetch_asteroid.py (the command is in the tutorial) and run from the
# repository root:
#   ./build/bin/ptm_thermal_sim --config examples/asteroid_eros_sphere.yaml
# Tutorial: docs/tutorials/06_asteroids.md

simulation:
  start_time: '1998-12-23T15:41:23'
  duration_days: 0.25            # six hours, a little more than one rotation
  timesteps: 72                  # five minutes between outputs
  body: Eros
mesh:
  resolution: 3                  # icosphere with 1,280 faces
thermal:
  run_thermal_mesh: true
  threads: 0
  equilibration_orbits: 500.0    # rotations before the window (about 110 days)
  equilibration_steps_per_day: 230.4
  use_gpu: false
thermophysical:
  use_default_albedo: false
radiation:
  enabled: false
illumination:
  include_primary_reflection: false
  use_albedo_map: false
output:
  directory: output/asteroid_eros_sphere
generic_body:
  name: 433 Eros (A898 PA)
  ephemeris_source: keplerian
  shape:
    type: spherical
    radius_km: 8.42
  orbit:                         # osculating elements at the epoch, from Horizons
    semi_major_axis_au: 1.45826243
    eccentricity: 0.22288405
    inclination_deg: 10.830128
    lon_ascending_node_deg: 304.430859
    arg_perihelion_deg: 178.613081
    mean_anomaly_deg: 209.049706
    epoch: 'JD 2451171.154470'
  spin:
    period_hours: 5.27
    pole_ra_deg: 11.37
    pole_dec_deg: 17.22
    prime_meridian_deg: 0.0
    epoch: 'JD 2451171.154470'
  surface:
    albedo: 0.151
    emissivity: 0.95
    ks: 0.01875                  # with rho and cp this gives a thermal inertia of 150
    kd: 0.01875
    rhos: 1500.0
    rhod: 1500.0
    H: 0.05
    cp0: 800.0
    Qb: 0.0
    chi: 0.0
